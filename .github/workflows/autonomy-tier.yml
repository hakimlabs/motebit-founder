name: Autonomy tier

# The `autonomy-tier` check of docs/proposals/repo-autonomy-v1.md ("Enforced
# by GitHub, not by the agent's good behaviour"). It FAILS when the machine
# reviewer (motebit-reviewer) has approved a PR that is not T0, or when the
# kill switch (repository variable AUTONOMY_T0, anything but `on`) is engaged
# and the machine reviewer's is the only approval. It passes otherwise: T0,
# a founder (hakimlabs) approval of the current head, or no machine approval.
#
# It grants NO authority. It only becomes a boundary once it is a required
# check in the main-protection ruleset (a founder action), and it has nothing
# to judge until the motebit-reviewer account exists.
#
# The tier comes from scripts/classify-autonomy-tier.ts and the verdict from
# scripts/autonomy-tier-verdict.ts — both run from the BASE checkout
# (`trusted/`), never from the PR head; the head is checked out only as git
# data (`subject/`) and none of its code runs. (A pull_request run still uses
# the PR's own copy of THIS file; .github/ is owned in CODEOWNERS, so an edit
# to it cannot merge without the founder.)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # An approval, an edited review, or a dismissal changes the verdict.
  pull_request_review:
    types: [submitted, edited, dismissed]
  # The merge queue (docs/ops/merge-queue.md): judged again against the exact
  # commits the queue builds, with the reviews as they stand at queue time.
  merge_group:
    types: [checks_requested]

concurrency:
  group: autonomy-tier-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

# Least privilege: read the repository and the PR's reviews; nothing else.
permissions:
  contents: read
  pull-requests: read

jobs:
  autonomy-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the base (the classifier and CODEOWNERS that judge)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: trusted
          persist-credentials: false

      - name: Check out the change as git data (never executed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          path: subject
          # The three-dot diff needs the merge base; the merge group needs base..head.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4
        with:
          package_json_file: trusted/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          # NO dependency cache: a cache a PR-scoped run wrote could poison
          # tsx or a dependency in the trusted checkout. setup-node's automatic
          # package-manager cache is switched off explicitly too.
          package-manager-cache: false

      - name: Install the base's dependencies (uncached)
        working-directory: trusted
        run: pnpm install --frozen-lockfile

      - name: Classify and decide
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          AUTONOMY_T0: ${{ vars.AUTONOMY_T0 }}
        run: >-
          pnpm exec tsx scripts/autonomy-tier-verdict.ts
          --event-name "$GITHUB_EVENT_NAME"
          --event-path "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_REPOSITORY"
          --subject "$GITHUB_WORKSPACE/subject"
