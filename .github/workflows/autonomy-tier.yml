name: Autonomy tier

# The `autonomy-tier` check of docs/proposals/repo-autonomy-v1.md (#1163; "Enforced
# by GitHub, not by the agent's good behaviour"). It FAILS when the machine
# reviewer (motebit-reviewer) has approved a PR that is not T0, or when the
# kill switch (repository variable AUTONOMY_T0, anything but `on`) is engaged
# and the machine reviewer's is the only approval. It passes otherwise: T0,
# a founder (hakimlabs) approval of the current head, or no machine approval.
#
# It grants NO authority. It only becomes a boundary once it is a required
# check in the main-protection ruleset (a founder action), and it has nothing
# to judge until the motebit-reviewer account exists.
#
# The tier comes from scripts/classify-autonomy-tier.ts and the verdict from
# scripts/autonomy-tier-verdict.ts. Both run from the BASE checkout
# (`trusted/`), never from the PR head; the head is checked out only as git
# data (`subject/`) and none of its code runs.
#
# ## Why pull_request_target, and no review trigger
#
# Every agent PR comes from a fork. A fork PR's `pull_request` and
# `pull_request_review` runs get no repository variables (seen live on #1181,
# 2026-10-27: those runs logged AUTONOMY_T0 and TURBO_TEAM empty while both
# were set; see https://docs.github.com/en/actions/learn-github-actions/variables),
# so the switch could never be off there.
# Such a run also uses the PR's own copy of THIS file. `pull_request_target`
# runs this file, and these scripts, from the base branch (docs: "Events that
# trigger workflows" > pull_request_target), and is expected per GitHub docs to
# get the variables; to be confirmed by the first post-merge run (if it reads
# them empty, the switch reads as engaged: fail-closed). Its check run
# attaches to the PR's HEAD commit, which is where a required check is read
# (the same holds for `cla` in cla.yml; seen live on #1181's head).
#
# There is no base-context review event: `pull_request_review` from a fork is
# fork-context with no variables, and skipping this job on it is no fix:
# GitHub reports a skipped job as "Success", even for a required check (docs:
# "Using conditions to control job execution"). So reviews are re-judged by:
#
#  1. merge_group (the authoritative judgement). main-protection requires the
#     merge queue, and the queue run re-judges every queued PR with its reviews
#     and the switch AS THEY STAND at queue time, from the API (the variables
#     are expected per GitHub docs on merge_group; to be confirmed live; read
#     empty, the switch reads engaged: fail-closed). A PR-side pass gone stale
#     (a machine approval or a dismissed founder approval after the last run)
#     therefore cannot land a
#     change: the group fails and the PR is dequeued.
#  2. Any later PR event: a push (`synchronize`; main-protection also dismisses
#     stale reviews on push) or an edit of the title or body (`edited`). This
#     is the recovery for a stale FAIL after a founder approval: edit the PR
#     body. It is a fresh event, so it runs main's current workflow and scripts.
#  3. Re-running the job. A re-run re-reads the live reviews from the API, but
#     keeps the original GITHUB_SHA, so it runs the OLD base copy of this file
#     and the scripts. Whether it reads the variable's current value is not yet
#     proven live; prefer (2).
#
# Each verdict reads the reviews and the PR head from the API when it runs,
# never from the event payload, and refuses to judge a head that has moved.
#
# ## pull_request_target safety (the "pwn request" trap)
#
# - No PR-head code runs. Scripts and dependencies come only from `trusted/`
#   (the base, `github.sha`: the commit whose copy of this file is running).
#   `subject/` is only read by git (rev-list, log, diff); no install, build or
#   script runs in it. A `.gitattributes` there cannot run a driver: drivers
#   come from git config, which the checkout does not take from the tree.
# - Read-only token (contents, pull-requests), no secrets, and
#   persist-credentials: false on both checkouts.
# - No event field is interpolated into a `run:` script; the script reads the
#   event file itself.
# - No dependency cache (a cache is the one thing a PR run could write that a
#   base run reads).
#
# The verdict script refuses every event but pull_request_target and
# merge_group (`judgedEvent`), so a trigger added back here fails closed.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # The merge queue (docs/ops/merge-queue.md): judged again against the exact
  # commits the queue builds, with the reviews as they stand at queue time.
  merge_group:
    types: [checks_requested]

concurrency:
  group: autonomy-tier-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

# Least privilege: read the repository and the PR's reviews; nothing else.
permissions:
  contents: read
  pull-requests: read

jobs:
  autonomy-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the base (the classifier and CODEOWNERS that judge)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request_target: github.sha is the base branch's tip, the
          # commit this workflow file was read from. merge_group: the group's
          # base (github.sha there is the queue commit, PR code included).
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out the change as git data (never executed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          path: subject
          # The three-dot diff needs the merge base; the merge group needs base..head.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4
        with:
          package_json_file: trusted/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          # NO dependency cache: a cache a PR-scoped run wrote could poison
          # tsx or a dependency in the trusted checkout. setup-node's automatic
          # package-manager cache is switched off explicitly too.
          package-manager-cache: false

      - name: Install the base's dependencies (uncached)
        working-directory: trusted
        run: pnpm install --frozen-lockfile

      - name: Classify and decide
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          AUTONOMY_T0: ${{ vars.AUTONOMY_T0 }}
        run: >-
          pnpm exec tsx scripts/autonomy-tier-verdict.ts
          --event-name "$GITHUB_EVENT_NAME"
          --event-path "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_REPOSITORY"
          --subject "$GITHUB_WORKSPACE/subject"
